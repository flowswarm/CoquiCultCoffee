<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed - Coqui Cult Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      background-color: #050505;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .film-grain {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.05;
      pointer-events: none;
      z-index: 9999;
    }

    .success-container {
      text-align: center;
      padding: 4rem 2rem;
      background: #111;
      border: 1px solid #C49A6C;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      max-width: 600px;
      width: 90%;
      position: relative;
      z-index: 10;
    }

    .btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 3rem;
      background: #C49A6C;
      color: #000;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #d4b08c;
    }
    @media (max-width: 480px) {
      .success-container {
        padding: 2.5rem 1.5rem;
        margin: 1rem;
      }
      h2 {
        font-size: 2.2rem !important;
      }
      p {
        font-size: 1rem !important;
      }
      .btn {
        padding: 0.85rem 2rem;
      }
    }
  </style>
</head>

<body>
  <div class="film-grain"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="success-container">
    <h2
      style="color: #C49A6C; font-family: 'Playfair Display', serif; font-size: 3rem; margin-top: 0; margin-bottom: 1rem;">
      Order Confirmed!</h2>
    <p style="color: #fff; font-family: 'Inter', sans-serif; font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem;">
      Your payment was processed successfully through Stripe. We're getting your order ready right now.
    </p>
    <div style="background: #1a1a1a; padding: 2rem; border-radius: 8px; border: 1px solid rgba(196, 154, 108, 0.3);">
      <p
        style="color: #C49A6C; font-family: 'Inter', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 0.5rem 0;">
        Pickup Location</p>
      <p style="color: #fff; font-family: 'Inter', sans-serif; font-size: 1.3rem; margin: 0; font-weight: bold;">
        Philadelphia, PA</p>
    </div>
    <a href="/index.html" class="btn">Return Home</a>
  </div>
</body>

</html>
