<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coqui Cult Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar">
      <a href="/index.html" class="logo-text" style="text-decoration: none; color: inherit;">COQUÍ CULT</a>
      <div class="nav-links">
        <a href="/menu.html">Menu</a>
        <a href="/about.html">About</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
      <video class="hero-video" autoplay loop muted playsinline>
        <source src="/assets/newhero.mp4" type="video/mp4">
      </video>
      <div class="hero-overlay"></div>
      
      <div class="hero-content">
      </div>
      
      <div class="scroll-indicator">
        <span>SCROLL</span>
        <div class="line"></div>
      </div>
    </section>

    <!-- Showcase / Menu Section -->
    <section class="showcase" id="menu">
      <div class="section-header">
        <h2 class="reveal-text">THE CULT COLLECTION</h2>
        <p class="reveal-text subtitle">Puerto Rican Coffee Cart | Philly</p>
      </div>
      <div class="gallery-container" id="gallery-container">
        <!-- Injected via main.js -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <h2>Join the Cult.</h2>
        <p>Philadelphia, PA</p>
        <a href="https://www.instagram.com/coquicultcoffee/" target="_blank" class="ig-link">@coquicultcoffee</a>
        <br><a href="/admin.html" style="font-size:0.7rem; color:#555; text-decoration:none; margin-top:10px; display:inline-block; transition: color 0.3s;" onmouseover="this.style.color='#C49A6C'" onmouseout="this.style.color='#555'">Admin</a>
      </div>
    </footer>

    <script type="module" src="/main.js"></script>
  </body>
</html>
